name: macOS release build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: master
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node scripts/build.mjs --allow-unconfigured-auth
        env:
          REPO_BERTH_GITHUB_CLIENT_ID: ${{ vars.REPO_BERTH_GITHUB_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: repo-berth-macOS-ARM64
          path: bin/
